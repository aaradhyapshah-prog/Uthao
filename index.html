<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UTHAO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="statusbar" aria-hidden="true">
        <span>1:56</span>
        <div class="status-icons">
          <span>◔</span>
          <span>◍</span>
          <span>◉</span>
          <span>◐</span>
        </div>
      </div>

      <div class="browser-bar" aria-label="Address bar">
        <div class="browser-brand">
          <span class="browser-home">⌂</span>
          <span class="browser-url">ah-prog.github.io</span>
        </div>
        <div class="browser-actions">
          <button class="browser-btn" type="button" aria-label="Add tab">＋</button>
          <span class="badge">3</span>
          <button class="browser-btn menu-btn" type="button" aria-label="More options">⋮</button>
        </div>
      </div>

      <div class="login-panel">
        <div class="stats-block">
          <p>2.4k+ <span>Active drivers</span></p>
          <p>4.8/5 <span>Average rating</span></p>
          <p>18 min <span>Quickest ride</span></p>
        </div>

        <div class="welcome-block">
          <p class="eyebrow">WELCOME BACK</p>
          <h1>Sign in to UTHAO</h1>
        </div>

        <form id="authForm" class="auth-form" novalidate>
          <label for="email">Email</label>
          <input id="email" type="email" value="aaradhyapshah@gmail.com" />

          <label for="password">Password</label>
          <input id="password" type="password" value="••••" />

          <div class="remember-row">
            <label class="remember-box">
              <input type="checkbox" checked />
              <span>Remember me</span>
            </label>
            <a href="#">Forgot password?</a>
          </div>

          <button type="submit" class="primary-btn pop">Enter UTHAO</button>
          <p id="login-status" class="status-line">Could not read response.</p>
          <div class="status-pill">Could not read response.</div>
        </form>
      </div>
    </div>

    <div id="toast" class="toast" role="status"></div>
    <script src="script.js"></script>
  </body>
</html>
