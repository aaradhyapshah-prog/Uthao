<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Uthao — Demo</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="/static/js/i18n.js" defer></script>
  <script src="/static/js/theme.js" defer></script>
  <script src="/static/js/app.js" defer></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
</head>
<body class="theme-system">
  <header class="topbar">
    <div class="logo">Uthao</div>
    <div class="top-actions">
      <select id="lang-select" aria-label="language">
        <option value="en">EN</option>
        <option value="ne">ने</option>
      </select>
      <button id="theme-toggle" aria-label="toggle theme">🌓</button>
      <img id="profile-pic" src="/static/img/default-avatar.svg" class="avatar" />
    </div>
  </header>
  <main id="main">
    <!-- Auth view (client-side demo) -->
    <section class="auth-container" id="auth-view">
      <form id="login-form" onsubmit="event.preventDefault(); apiLogin();">
        <h1 data-i18n="login_title">Welcome back</h1>
        <input id="email" name="email" type="email" placeholder="Email" required value="aaradhyapshah@gmail.com" />
        <input id="password" name="password" type="password" placeholder="Password" required />
        <button type="submit" class="btn">Enter UTHAO</button>
        <p>Don't have an account? <a href="#" onclick="showSignup()">Sign up</a></p>
        <div id="login-error" class="login-error" style="display:none;color:#34d399;margin-top:12px;"></div>
      </form>
    </section>

    <!-- Dashboard / SPA -->
    <section class="dashboard hidden" id="dashboard-view">
      <div class="tiles">
        <div class="tile" data-feature="ride" onclick="openFeature('ride')">
          <div class="icon">🚗</div><div class="label" data-i18n="tile_ride">Ride</div>
        </div>
        <div class="tile" data-feature="food" onclick="openFeature('food')">
          <div class="icon">🍔</div><div class="label" data-i18n="tile_food">Food</div>
        </div>
        <div class="tile" data-feature="courier" onclick="openFeature('courier')">
          <div class="icon">📦</div><div class="label" data-i18n="tile_courier">Courier</div>
        </div>
        <div class="tile" data-feature="settings" onclick="openFeature('settings')">
          <div class="icon">⚙️</div><div class="label" data-i18n="tile_settings">Settings</div>
        </div>
        <div class="tile" data-feature="history" onclick="openFeature('history')">
          <div class="icon">🧾</div><div class="label" data-i18n="tile_history">Activity</div>
        </div>
        <div class="tile" data-feature="support" onclick="openFeature('support')">
          <div class="icon">💬</div><div class="label" data-i18n="tile_support">Support</div>
        </div>
      </div>

      <section id="ride-panel" class="panel hidden">
        <div id="map" style="height:400px"></div>
        <div class="ride-controls">
          <input id="pickup" placeholder="Pickup"/>
          <input id="dropoff" placeholder="Dropoff"/>
          <button onclick="setPinsFromInputs()">Set Pins</button>
          <button onclick="requestRide()">Book Ride</button>
          <div id="route-info"></div>
        </div>
      </section>

      <section id="settings-panel" class="panel hidden"><h2>Settings (Client demo)</h2></section>
      <section id="history-panel" class="panel hidden"><h2>Activity / History (Client demo)</h2></section>
    </section>

    <footer style="padding:16px;text-align:center;color:var(--text);opacity:0.8;">This is a static demo on GitHub Pages. Server-side features (login, orders) require the backend.</footer>
  </main>

  <script>
    function showSignup(){ alert('Signup not available in static demo'); }
  </script>
</body>
</html>
