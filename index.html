<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UTHAO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <div id="auth-screen" class="screen auth-screen">
        <div class="auth-card">
          <div class="auth-header">
            <div class="brand-block">
              <div class="brand-mark">U</div>
              <div>
                <span class="brand-name">UTHAO</span>
              </div>
            </div>
            <div class="auth-switcher" aria-label="Authentication switch">
              <button class="tab-btn active" data-auth="login" type="button">Login</button>
              <button class="tab-btn" data-auth="signup" type="button">Sign Up</button>
            </div>
          </div>

          <form id="login-form" class="auth-form active" novalidate>
            <div class="field-group">
              <label for="login-email">Email</label>
              <input id="login-email" type="email" placeholder="you@example.com" required />
            </div>
            <div class="field-group">
              <label for="login-password">Password</label>
              <input id="login-password" type="password" placeholder="Enter password" required />
            </div>
            <button type="submit" class="primary-btn">Enter UTHAO</button>
          </form>

          <form id="signup-form" class="auth-form hidden" novalidate>
            <div class="field-group">
              <label for="signup-name">Full name</label>
              <input id="signup-name" type="text" placeholder="Your name" required />
            </div>
            <div class="field-group">
              <label for="signup-email">Email</label>
              <input id="signup-email" type="email" placeholder="you@example.com" required />
            </div>
            <div class="field-group">
              <label for="signup-password">Password</label>
              <input id="signup-password" type="password" placeholder="Create password" required />
            </div>
            <button type="submit" class="primary-btn">Create Account</button>
          </form>
        </div>
      </div>

      <div id="app-screen" class="screen app-screen hidden">
        <header class="topbar">
          <div class="brand-block left-brand">
            <div class="brand-mark">U</div>
            <div>
              <span class="brand-name">UTHAO</span>
            </div>
          </div>

          <div class="topbar-tools">
            <div class="lang-switch" aria-label="Language selector">
              <button class="lang-btn active" data-lang="en" type="button">English</button>
              <button class="lang-btn" data-lang="ne" type="button">नेपाली</button>
            </div>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme">☀</button>
            <button id="profile-btn" class="profile-btn" type="button" aria-label="Open account modal">
              <span>U</span>
            </button>
          </div>
        </header>

        <main class="dashboard">
          <section class="welcome-panel">
            <p class="eyebrow" data-i18n="welcomeLabel">Welcome</p>
            <h1 data-i18n="heading">Where to?</h1>
          </section>

          <section class="feature-grid" aria-label="Feature cards">
            <button class="feature-card" type="button" data-feature="ride">
              <div class="card-icon ride-icon">◆</div>
              <span data-i18n="ride">Ride</span>
              <small data-i18n="rideSub">Fast pickups</small>
            </button>

            <button class="feature-card" type="button" data-feature="food">
              <div class="card-icon food-icon">✦</div>
              <span data-i18n="food">Food</span>
              <small data-i18n="foodSub">Order meals</small>
            </button>

            <button class="feature-card" type="button" data-feature="courier">
              <div class="card-icon courier-icon">✉</div>
              <span data-i18n="courier">Courier</span>
              <small data-i18n="courierSub">Send parcels</small>
            </button>

            <button class="feature-card" type="button" data-feature="settings">
              <div class="card-icon settings-icon">⚙</div>
              <span data-i18n="settings">Settings</span>
              <small data-i18n="settingsSub">Preferences</small>
            </button>

            <button class="feature-card" type="button" data-feature="activity">
              <div class="card-icon activity-icon">◷</div>
              <span data-i18n="activity">Activity</span>
              <small data-i18n="activitySub">Trip history</small>
            </button>

            <button class="feature-card" type="button" data-feature="support">
              <div class="card-icon support-icon">✆</div>
              <span data-i18n="support">Review & Customer Support</span>
              <small data-i18n="supportSub">Feedback & help</small>
            </button>
          </section>

          <section id="feature-detail" class="feature-detail">
            <h2 id="detail-title" data-i18n="ride">Ride</h2>
            <p id="detail-copy" data-i18n="rideText">Book a ride, set your fare, and let nearby drivers bid for your trip.</p>
          </section>
        </main>
      </div>
    </div>

    <div id="account-modal" class="modal-backdrop hidden" aria-hidden="true">
      <div class="account-modal" role="dialog" aria-modal="true" aria-labelledby="account-title">
        <button id="close-modal" class="close-modal" type="button" aria-label="Close account">×</button>

        <div class="account-header">
          <div class="profile-avatar" id="modal-avatar">U</div>
          <div>
            <h3 id="account-title">My Account</h3>
            <p id="modal-email">user@example.com</p>
          </div>
        </div>

        <div class="account-form">
          <div class="field-group">
            <label for="account-name">Username</label>
            <input id="account-name" type="text" value="Uthao User" />
          </div>
          <div class="field-group">
            <label for="account-email">Email</label>
            <input id="account-email" type="email" value="user@example.com" />
          </div>
          <div class="field-group">
            <label for="account-phone">Phone</label>
            <input id="account-phone" type="tel" value="+977 9800000000" />
          </div>
          <div class="field-group">
            <label for="account-image">Profile Picture URL</label>
            <input id="account-image" type="url" placeholder="https://example.com/avatar.jpg" />
          </div>
        </div>

        <div class="modal-actions">
          <button id="save-profile" class="primary-btn small" type="button">Save Changes</button>
          <button id="logout-btn" class="secondary-btn" type="button">Logout</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="script.js"></script>
  </body>
</html>
